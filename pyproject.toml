[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiobench"
version = "2.0.0"
description = "Offline AI audio toolkit — transcribe, search, chat, visualize, and speak"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "de3f4ault"},
]
keywords = ["transcription", "whisper", "audio", "speech-to-text", "offline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "faster-whisper>=1.1.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "weasyprint>=63.0",
    "jinja2>=3.0.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "textual>=0.50.0",
    "json-repair>=0.61.0",
    "questionary>=2.0.0",
    "tomli-w>=1.0.0",
    "mutagen>=1.47.0",
    "psutil>=5.9.0",
    "sounddevice>=0.5.0",
    "piper-tts>=1.2.0",
    "bcrypt>=4.0.0",
]

[project.optional-dependencies]
test = ["hypothesis>=6.0.0"]
memory = [
    "lancedb>=0.6.0",
    "llama-index-core>=0.10.0",
    "llama-index-vector-stores-lancedb>=0.1.0",
    "llama-index-embeddings-huggingface>=0.2.0",
    "sentence-transformers>=3.0.0",
    "rerankers>=0.0.4",
    "hnswlib>=0.8.0",
]
streaming = ["RealtimeSTT>=0.3.0"]
diarization = ["pyannote.audio>=3.3.0", "torch>=2.0.0", "torchaudio>=2.0.0", "torchcodec>=0.15.0"]
tts = ["piper-tts>=1.2.0", "sounddevice>=0.5.0"]
ai = ["requests>=2.31.0"]
vosk = ["vosk>=0.3.45"]
google = ["google-genai>=1.0.0", "tenacity>=8.5.0"]
api = ["fastapi>=0.100.0", "uvicorn>=0.23.0", "python-multipart>=0.0.6", "sse-starlette>=1.6.5", "litellm>=1.0.0"]
align = [
    # Alignment now uses faster-whisper (already a core dependency via the
    # whisper engine). No additional packages required — ctc-forced-aligner
    # was removed because its ONNX runtime leaks C++ heap memory across
    # repeated calls and causes SIGABRT on long files.
    "faster-whisper>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
docs = ["zensical>=0.0.23"]
youtube = ["yt-dlp>=2024.1.1"]
all = ["audiobench[memory,streaming,diarization,tts,ai,vosk,google,api,dev,docs,align,youtube]"]

[project.scripts]
audiobench = "audiobench.cli.app:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["audiobench*"]

[tool.setuptools.package-data]
audiobench = [
    "storage/migrations/*.sql",
    "export/templates/*.html",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
